name: HG Import Validated CHI Packet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hg-import-chi-packet.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKET_NAME: "2026-10-06-hg-gpt54mini-full75-37043550087"
      SUB_BRANCH: "sub/chi-bench/2026-10-06-hg-gpt54mini-full75-37043550087"
      SOURCE_SHA: "10aacb335efdba399395b943cbc1859c396e60f3"
      EXPECTED_SHA256: "e2fa4f536ac8ccf6fc95c76f7aad8b1f4a0d25451f4d6ae5471fab822773b692"
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validator dependencies
        run: python -m pip install --quiet jsonschema zstandard

      - name: Download immutable validated packet archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/hgreco85/HG-Market-System/${SOURCE_SHA}/competitions/chi-bench/leaderboard-packets/${PACKET_NAME}.tar.gz"
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/packet.tar.gz
          actual="$(sha256sum /tmp/packet.tar.gz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          mkdir -p /tmp/packet
          tar -C /tmp/packet -xzf /tmp/packet.tar.gz
          test -d "/tmp/packet/${PACKET_NAME}"

      - name: Validate packet again in leaderboard repo
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate_submission.py "/tmp/packet/${PACKET_NAME}" --repo-root .

      - name: Create clean submission branch from upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/actava-ai/leaderboard.git || true
          git fetch upstream main
          git checkout -B "$SUB_BRANCH" upstream/main
          dest="benchmarks/chi-bench/submissions/${PACKET_NAME}"
          test ! -e "$dest"
          cp -a "/tmp/packet/${PACKET_NAME}" "$dest"
          python .github/scripts/validate_submission.py "$dest" --repo-root .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git diff --cached --name-only | awk -v p="$dest/" 'index($0,p)!=1 {bad=1} END {exit bad}'
          git commit -m "chi-bench: HG · hg-closure-codex · gpt-5.4-mini"
          git push --force origin "$SUB_BRANCH"
          echo "submission_branch=$SUB_BRANCH"
          echo "submission_commit=$(git rev-parse HEAD)"
