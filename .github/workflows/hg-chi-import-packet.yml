name: HG CHI import validated packet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hg-chi-import-packet.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKET_DIR: "2026-10-06-hg-gpt54mini-full75-37043550087"
      TARGET_BRANCH: "sub/chi-bench/2026-10-06-hg-gpt54mini-full75-37043550087"
      CHUNK_BRANCH: "tmp/hg-chi-packet-chunks-37043550087"
      ARCHIVE_SHA256: "4be329ee528301639a7ed0c9816e3a3704b8faae51d9981747e2db183cebc446"
      PUBLIC_CONTACT: "104028160+hgreco85@users.noreply.github.com"
    steps:
      - name: Checkout packet chunks from fork
        uses: actions/checkout@v4
        with:
          repository: hgreco85/leaderboard
          ref: ${{ env.CHUNK_BRANCH }}
          path: packet-source
          persist-credentials: false

      - name: Checkout upstream leaderboard main
        uses: actions/checkout@v4
        with:
          repository: actava-ai/leaderboard
          ref: main
          path: leaderboard
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and verify packet archive
        shell: bash
        run: |
          set -euo pipefail
          src="packet-source/tmp/hg-chi-packet-chunks-37043550087"
          test "$(cat "$src/part-count.txt")" = "11"
          cat "$src"/part-[0-9][0-9][0-9] | base64 -d > /tmp/packet.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/packet.tar.gz" | sha256sum -c -

      - name: Extract packet into clean upstream tree
        shell: bash
        working-directory: leaderboard
        run: |
          set -euo pipefail
          target="benchmarks/chi-bench/submissions/$PACKET_DIR"
          test ! -e "$target"
          tar -xzf /tmp/packet.tar.gz -C benchmarks/chi-bench/submissions/
          test -d "$target"

      - name: Replace placeholder contact with public GitHub noreply contact
        shell: bash
        working-directory: leaderboard
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("benchmarks/chi-bench/submissions")/os.environ["PACKET_DIR"]
          contact=os.environ["PUBLIC_CONTACT"]
          mf=root/"submission.json"
          data=json.loads(mf.read_text())
          data["submission"]["contact"]=contact
          mf.write_text(json.dumps(data,indent=2)+"\n")
          sy=root/"sub.yaml"
          text=sy.read_text().replace("hgreco85@gmail.com",contact)
          sy.write_text(text)
          assert "hgreco85@gmail.com" not in mf.read_text()
          assert "hgreco85@gmail.com" not in sy.read_text()
          print("contact_sanitized",contact)
          PY

      - name: Validate packet with official leaderboard validator
        shell: bash
        working-directory: leaderboard
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema zstandard
          python scripts/validate.py "benchmarks/chi-bench/submissions/$PACKET_DIR"

      - name: Ensure submission-only diff
        shell: bash
        working-directory: leaderboard
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "^benchmarks/chi-bench/submissions/$PACKET_DIR(/|$)"; then
            echo "Unexpected files outside submission packet" >&2
            exit 1
          fi

      - name: Commit clean submission branch to fork
        shell: bash
        working-directory: leaderboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "hgreco85"
          git config user.email "$PUBLIC_CONTACT"
          git checkout -B "$TARGET_BRANCH"
          git add "benchmarks/chi-bench/submissions/$PACKET_DIR"
          git commit -m "chi-bench: HG · hg-closure-codex · openai/gpt-5.4-mini"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/hgreco85/leaderboard.git"
          git push --force origin "$TARGET_BRANCH"
          echo "submission_commit=$(git rev-parse HEAD)"
