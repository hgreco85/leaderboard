name: HG import validated CHI packet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hg-chi-import-packet.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUBDIR: "2026-10-06-hg-gpt54mini-full75-37043550087"
      SUB_BRANCH: "sub/chi-bench/2026-10-06-hg-gpt54mini-full75-37043550087"
      ARCHIVE_URL: "https://raw.githubusercontent.com/hgreco85/HG-Market-System/10aacb335efdba399395b943cbc1859c396e60f3/competitions/chi-bench/leaderboard-packets/2026-10-06-hg-gpt54mini-full75-37043550087.tar.gz"
      SHA_URL: "https://raw.githubusercontent.com/hgreco85/HG-Market-System/10aacb335efdba399395b943cbc1859c396e60f3/competitions/chi-bench/leaderboard-packets/2026-10-06-hg-gpt54mini-full75-37043550087.sha256"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start submission branch from upstream main
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/actava-ai/leaderboard.git || true
          git fetch upstream main
          git checkout -B "$SUB_BRANCH" upstream/main

      - name: Download and verify validated packet
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/packet.tar.gz
          curl -fL --retry 3 --retry-delay 2 "$SHA_URL" -o /tmp/packet.sha256
          expected="$(awk '{print $1}' /tmp/packet.sha256)"
          actual="$(sha256sum /tmp/packet.tar.gz | awk '{print $1}')"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Extract packet into official leaderboard path
        shell: bash
        run: |
          set -euo pipefail
          dest="benchmarks/chi-bench/submissions"
          test ! -e "$dest/$SUBDIR"
          tar -C "$dest" -xzf /tmp/packet.tar.gz
          test -f "$dest/$SUBDIR/submission.json"
          test -d "$dest/$SUBDIR/trials"

      - name: Validate packet with leaderboard validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema zstandard
          python scripts/validate.py "benchmarks/chi-bench/submissions/$SUBDIR"

      - name: Commit and push clean submission branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git status --porcelain | awk '{print $2}')"
          test -n "$changed"
          if git status --porcelain | awk '{print $2}' | grep -v "^benchmarks/chi-bench/submissions/$SUBDIR/" ; then
            echo "Unexpected path outside submission directory" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "benchmarks/chi-bench/submissions/$SUBDIR"
          git commit -m "chi-bench: HG · hg-closure-codex · openai/gpt-5.4-mini"
          git push --force origin "HEAD:refs/heads/$SUB_BRANCH"
          echo "submission_branch=$SUB_BRANCH"
